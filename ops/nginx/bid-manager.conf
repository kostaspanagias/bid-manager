# Alternative to Caddy: nginx as the TLS-terminating reverse proxy (certificates e.g. from certbot).
# One proxy in front of the app → TRUST_PROXY=1.
server {
    listen 80;
    server_name bids.example.gr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bids.example.gr;

    ssl_certificate     /etc/letsencrypt/live/bids.example.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bids.example.gr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 210m;          # file uploads up to 200 MB
    proxy_request_buffering off;        # stream uploads to the app instead of spooling them on the proxy's disk

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;      # replace, do not append: the app trusts exactly one hop
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
